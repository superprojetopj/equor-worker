services:
  worker:
    build: .
    container_name: equor-worker
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
    volumes:
      # Montado no mesmo path do repositório para que
      # GOOGLE_APPLICATION_CREDENTIALS=./src/config/keys/<key>.json (definido no
      # .env) valha igual no container e rodando local. Não fixe a credencial
      # aqui: environment: sobrescreve env_file: e o .env deixa de valer.
      - ./src/config/keys:/app/src/config/keys:ro
